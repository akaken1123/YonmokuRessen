<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>画面遷移ボード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+JP:wght@400;500;600&display=swap">
<style>
/* Layout: drafting table — tool rail left, infinite dotted canvas center, inspector right; collapses to stacked rail + bottom sheet on phones */
:root{
  --paper:#EEF1F4; --surface:#FFFFFF; --ink:#1B2430; --ink-2:#5B6675; --line:#D3D9E0; --grid:#BCC5CF;
  --accent:#2457D6; --accent-t:#DCE5FA; --edge:#3A4656; --screen:#FFFFFF; --wf:#E4E8EE; --on-solid:#FFFFFF;
  --blue:#2F64E0; --blue-t:#DCE6FB; --teal:#0F8C8C; --teal-t:#D2EEEE; --green:#2E8B4E; --green-t:#DAEFDF;
  --amber:#B7791F; --amber-t:#F6E8CC; --rose:#C23B5A; --rose-t:#F7DCE2; --slate:#5B6675; --slate-t:#E2E6EB;
  --shadow:0 1px 2px rgba(27,36,48,.08),0 4px 14px rgba(27,36,48,.08);
  --f-ui:"IBM Plex Sans JP","Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#12161C; --surface:#1A2028; --ink:#E4E9EF; --ink-2:#95A0AE; --line:#2C3541; --grid:#323B47;
  --accent:#7398FF; --accent-t:#22335A; --edge:#A9B4C2; --screen:#1F2630; --wf:#2E3642; --on-solid:#11151B;
  --blue:#6E95FF; --blue-t:#213459; --teal:#3CBFBF; --teal-t:#173F42; --green:#57C27A; --green-t:#1E3D29;
  --amber:#E3A64A; --amber-t:#4A3A1C; --rose:#EE6F8C; --rose-t:#4B2230; --slate:#95A0AE; --slate-t:#2E3642;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3); color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#12161C; --surface:#1A2028; --ink:#E4E9EF; --ink-2:#95A0AE; --line:#2C3541; --grid:#323B47;
  --accent:#7398FF; --accent-t:#22335A; --edge:#A9B4C2; --screen:#1F2630; --wf:#2E3642; --on-solid:#11151B;
  --blue:#6E95FF; --blue-t:#213459; --teal:#3CBFBF; --teal-t:#173F42; --green:#57C27A; --green-t:#1E3D29;
  --amber:#E3A64A; --amber-t:#4A3A1C; --rose:#EE6F8C; --rose-t:#4B2230; --slate:#95A0AE; --slate-t:#2E3642;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3); color-scheme:dark }

html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:13px;display:grid;grid-template-rows:auto 1fr;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--line);position:relative;z-index:3}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;letter-spacing:.02em;white-space:nowrap}
.brand svg{flex:none}
#docname{border:1px solid transparent;background:transparent;border-radius:6px;padding:5px 8px;font-weight:500;min-width:0;width:15em;max-width:40vw}
#docname:hover{border-color:var(--line)}
#docname:focus{border-color:var(--accent);outline:none;background:var(--paper)}
.sp{flex:1}
.grp{display:flex;align-items:center;gap:2px;padding:2px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.tb{border:0;background:transparent;border-radius:6px;padding:5px 9px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;color:var(--ink)}
.tb:hover{background:var(--paper)}
.tb:disabled{opacity:.35;cursor:default;background:transparent}
.tb.primary{background:var(--accent);color:var(--on-solid);font-weight:500}
.tb.primary:hover{filter:brightness(1.08)}
#zoomv{font-family:var(--f-mono);font-size:12px;min-width:3.6em;text-align:center;font-variant-numeric:tabular-nums}
.tb svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
#panelbtn{display:none}

/* main */
.app{display:grid;grid-template-columns:76px 1fr 288px;min-height:0;position:relative}
.rail{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px;padding:10px 8px;overflow:auto}
.rail h3{font-size:10px;font-weight:500;color:var(--ink-2);letter-spacing:.12em;margin:8px 0 4px;text-align:center}
.tool{border:1px solid transparent;background:transparent;border-radius:8px;padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--ink);cursor:grab;user-select:none}
.tool:hover{background:var(--paper);border-color:var(--line)}
.tool:active{cursor:grabbing}
.tool svg{width:30px;height:30px;fill:none;stroke:var(--ink-2);stroke-width:1.4}
.tool svg .f{fill:var(--accent-t);stroke:var(--accent)}

.stage{position:relative;min-width:0;min-height:0;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none;display:block}
#cv.panning{cursor:grabbing}
.hint{position:absolute;left:12px;bottom:12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px;color:var(--ink-2);font-size:12px;pointer-events:none;box-shadow:var(--shadow);max-width:calc(100% - 24px)}
.hint b{color:var(--ink);font-weight:500}

/* inspector */
.panel{background:var(--surface);border-left:1px solid var(--line);overflow:auto;padding:14px 16px 24px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel h2{font-size:11px;font-weight:500;letter-spacing:.12em;color:var(--ink-2);margin:0;text-transform:uppercase}
.panel .kind{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}
.chip{font-family:var(--f-mono);font-size:10px;font-weight:500;padding:2px 6px;border-radius:4px;background:var(--accent-t);color:var(--accent);letter-spacing:.04em}
.fld{display:flex;flex-direction:column;gap:5px}
.fld label,.fld .lb{font-size:11px;color:var(--ink-2);font-weight:500}
.fld input[type=text],.fld textarea{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:7px 9px;width:100%;box-sizing:border-box}
.fld textarea{font-family:var(--f-mono);font-size:12px;line-height:1.6;min-height:150px;resize:vertical}
.fld input:focus,.fld textarea:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--line);border-radius:7px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;border-radius:5px;padding:5px 4px;font-size:12px;color:var(--ink-2)}
.seg button[aria-pressed=true]{background:var(--accent-t);color:var(--accent);font-weight:500}
.sw{display:flex;gap:6px;flex-wrap:wrap}
.sw button{width:24px;height:24px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);padding:0}
.sw button[aria-pressed=true]{box-shadow:0 0 0 2px var(--ink)}
.row{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 10px;font-size:12px}
.btn:hover{background:var(--paper)}
.btn.danger{color:var(--rose);border-color:color-mix(in srgb,var(--rose) 40%,var(--line))}
.syntax{font-family:var(--f-mono);font-size:11px;color:var(--ink-2);display:grid;grid-template-columns:auto 1fr;gap:3px 10px;background:var(--paper);border-radius:6px;padding:8px 10px}
.syntax code{color:var(--ink)}
.trans{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.trans li{display:flex;align-items:center;gap:6px;font-size:12px;min-width:0}
.trans li span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trans .lbl{font-family:var(--f-mono);color:var(--ink-2);font-size:11px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.stat b{display:block;font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--ink-2)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:5px 10px;font-size:12px;color:var(--ink-2);margin:0}
.keys dt{font-family:var(--f-mono);font-size:11px;color:var(--ink);white-space:nowrap}
.keys dd{margin:0}
.chk{display:flex;align-items:center;gap:8px;font-size:12px}

/* modal + toast */
.modal{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 35%,transparent);display:grid;place-items:center;z-index:20;padding:16px}
.dlg{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);width:min(640px,100%);max-height:calc(100% - 32px);display:flex;flex-direction:column;gap:12px;padding:16px;box-sizing:border-box;min-width:0}
.dlg header{display:flex;align-items:center;gap:8px}
.dlg h4{margin:0;font-size:15px;flex:1}
.dlg textarea{width:100%;box-sizing:border-box;min-height:240px;flex:1;font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);border-radius:6px;padding:8px;background:var(--paper);resize:vertical}
.dlg .tabs{display:flex;gap:4px;flex-wrap:wrap}
.dlg .note{font-size:12px;color:var(--ink-2);margin:0}
.dlg img{max-width:100%;border:1px solid var(--line);border-radius:6px;background:var(--paper);max-height:50vh;object-fit:contain}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:8px 14px;border-radius:8px;font-size:12px;z-index:30;box-shadow:var(--shadow);max-width:calc(100% - 32px)}

@media (max-width:760px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .rail{flex-direction:row;border-right:0;border-bottom:1px solid var(--line);padding:6px 16px;overflow-x:auto}
  .rail h3{display:none}
  .tool{flex:none;width:62px}
  .panel{position:absolute;left:0;right:0;bottom:0;max-height:46%;border-left:0;border-top:1px solid var(--line);box-shadow:var(--shadow);z-index:4;border-radius:12px 12px 0 0;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
  .panel.closed{display:none}
  #panelbtn{display:inline-flex}
  .hint{display:none}
  #docname{width:9em}
  .brand span{display:none}
}
</style>
<style id="dcss">
.grid-dot{fill:var(--grid)}
.frame{fill:var(--screen);stroke:var(--line);stroke-width:1.2}
.frame.fdlg{stroke-dasharray:5 3;stroke:var(--ink-2)}
.ttl{font:600 13px var(--f-ui);fill:var(--ink)}
.hb-blue{fill:var(--blue-t)}.hb-teal{fill:var(--teal-t)}.hb-green{fill:var(--green-t)}.hb-amber{fill:var(--amber-t)}.hb-rose{fill:var(--rose-t)}.hb-slate{fill:var(--slate-t)}
.hs-blue{fill:var(--blue)}.hs-teal{fill:var(--teal)}.hs-green{fill:var(--green)}.hs-amber{fill:var(--amber)}.hs-rose{fill:var(--rose)}.hs-slate{fill:var(--slate)}
.ks-blue{stroke:var(--blue)}.ks-teal{stroke:var(--teal)}.ks-green{stroke:var(--green)}.ks-amber{stroke:var(--amber)}.ks-rose{stroke:var(--rose)}.ks-slate{stroke:var(--slate)}
.dot3{fill:var(--ink-2);opacity:.5}
.wf-h{font:600 14px var(--f-ui);fill:var(--ink)}
.wf-t{font:400 12px var(--f-ui);fill:var(--ink-2)}
.wf-bt{font:500 12px var(--f-ui);fill:var(--on-solid)}
.wf-in{fill:var(--paper);stroke:var(--line)}
.wf-it{font:400 12px var(--f-ui);fill:var(--ink-2);opacity:.75}
.wf-li{stroke:var(--line)}
.wf-chev{stroke:var(--ink-2);fill:none;stroke-width:1.4}
.wf-img{fill:var(--wf)}
.wf-x{stroke:var(--line);stroke-width:1}
.wf-il{font:500 11px var(--f-mono);fill:var(--ink-2)}
.wf-home{fill:var(--ink-2);opacity:.4}
.term{fill:var(--surface);stroke-width:1.6}
.term-t{font:600 13px var(--f-ui);fill:var(--ink)}
.dec{stroke-width:1.6}
.note-b{fill:var(--amber-t);stroke:var(--amber);stroke-width:1}
.note-f{fill:var(--amber);opacity:.35}
.note-h{font:600 12px var(--f-ui);fill:var(--ink)}
.note-t{font:400 12px var(--f-ui);fill:var(--ink-2)}
.ln{fill:none;stroke:var(--edge);stroke-width:1.6}
.ln.dash{stroke-dasharray:6 4}
.hit{fill:none;stroke:transparent;stroke-width:14;cursor:pointer}
.elabel rect{fill:var(--paper);stroke:var(--line)}
.elabel text{font:500 11px var(--f-ui);fill:var(--ink)}
.arrow{fill:var(--edge)}
.arrow-s{fill:var(--accent)}
.edge.sel .ln{stroke:var(--accent);stroke-width:2.2}
.edge.sel .elabel rect{stroke:var(--accent)}
.edge:hover .ln{stroke-width:2.2}
.node{cursor:move}
.selbox{fill:none;stroke:var(--accent);stroke-width:1.5;stroke-dasharray:4 3}
.node.target .frame,.node.target .term,.node.target .dec,.node.target .note-b{stroke:var(--accent);stroke-width:2.5}
.port{fill:var(--surface);stroke:var(--accent);stroke-width:1.6;opacity:0;cursor:crosshair;transition:opacity .12s}
.node:hover .port,.node.sel .port,.connecting .port{opacity:1}
.port:hover{fill:var(--accent)}
.tmp{fill:none;stroke:var(--accent);stroke-width:1.8;stroke-dasharray:5 4;pointer-events:none}
.boxsel{fill:var(--accent-t);fill-opacity:.4;stroke:var(--accent);stroke-dasharray:4 3;pointer-events:none}
@media (prefers-reduced-motion:reduce){.port{transition:none}}
</style>

<header class="bar">
  <div class="brand">
    <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><rect x="1.5" y="3" width="7" height="12" rx="1.6" fill="none" stroke="var(--accent)" stroke-width="1.6"/><rect x="13.5" y="7" width="7" height="12" rx="1.6" fill="var(--accent-t)" stroke="var(--accent)" stroke-width="1.6"/><path d="M8.5 9h3.5v4h1.5" fill="none" stroke="var(--ink)" stroke-width="1.4"/></svg>
    <span>画面遷移ボード</span>
  </div>
  <input id="docname" type="text" aria-label="図の名前" spellcheck="false">
  <div class="sp"></div>
  <div class="grp">
    <button class="tb" id="b-undo" title="元に戻す (Ctrl+Z)" aria-label="元に戻す"><svg viewBox="0 0 16 16"><path d="M5 3 2 6l3 3"/><path d="M2 6h7.5a4 4 0 0 1 0 8H7"/></svg></button>
    <button class="tb" id="b-redo" title="やり直し (Ctrl+Shift+Z)" aria-label="やり直し"><svg viewBox="0 0 16 16"><path d="m11 3 3 3-3 3"/><path d="M14 6H6.5a4 4 0 0 0 0 8H9"/></svg></button>
  </div>
  <div class="grp">
    <button class="tb" id="b-zout" title="縮小" aria-label="縮小"><svg viewBox="0 0 16 16"><path d="M3 8h10"/></svg></button>
    <span id="zoomv">100%</span>
    <button class="tb" id="b-zin" title="拡大" aria-label="拡大"><svg viewBox="0 0 16 16"><path d="M3 8h10M8 3v10"/></svg></button>
    <button class="tb" id="b-fit" title="全体を表示">全体</button>
  </div>
  <div class="grp">
    <button class="tb" id="b-new">新規</button>
    <button class="tb" id="b-import">読み込み</button>
    <button class="tb primary" id="b-export">書き出し</button>
  </div>
  <button class="tb" id="panelbtn" aria-label="パネルを開閉">パネル</button>
</header>

<div class="app">
  <nav class="rail" aria-label="図形">
    <h3>画面</h3>
    <div class="tool" draggable="true" data-add="mobile" role="button" tabindex="0" title="スマホ画面を追加"><svg viewBox="0 0 30 30"><rect class="f" x="9" y="3" width="12" height="24" rx="2.5"/><path d="M12 8h6M12 12h6M12 16h4"/></svg>スマホ</div>
    <div class="tool" draggable="true" data-add="desktop" role="button" tabindex="0" title="PC画面を追加"><svg viewBox="0 0 30 30"><rect class="f" x="3" y="6" width="24" height="16" rx="2"/><path d="M11 26h8M15 22v4"/></svg>PC</div>
    <div class="tool" draggable="true" data-add="dialog" role="button" tabindex="0" title="ダイアログを追加"><svg viewBox="0 0 30 30"><rect x="3" y="5" width="24" height="20" rx="2" stroke-dasharray="3 2"/><rect class="f" x="8" y="10" width="14" height="10" rx="2"/></svg>ダイアログ</div>
    <h3>フロー</h3>
    <div class="tool" draggable="true" data-add="decision" role="button" tabindex="0" title="分岐を追加"><svg viewBox="0 0 30 30"><path class="f" d="M15 4 27 15 15 26 3 15z"/></svg>分岐</div>
    <div class="tool" draggable="true" data-add="start" role="button" tabindex="0" title="開始を追加"><svg viewBox="0 0 30 30"><rect class="f" x="3" y="9" width="24" height="12" rx="6"/></svg>開始</div>
    <div class="tool" draggable="true" data-add="end" role="button" tabindex="0" title="終了を追加"><svg viewBox="0 0 30 30"><rect x="3" y="9" width="24" height="12" rx="6"/><rect class="f" x="5.5" y="11.5" width="19" height="7" rx="3.5"/></svg>終了</div>
    <div class="tool" draggable="true" data-add="note" role="button" tabindex="0" title="メモを追加"><svg viewBox="0 0 30 30"><path class="f" d="M5 5h20v14l-6 6H5z"/><path d="M19 25v-6h6"/></svg>メモ</div>
  </nav>

  <main class="stage">
    <svg id="cv" aria-label="画面遷移図キャンバス">
      <defs>
        <pattern id="gridp" width="20" height="20" patternUnits="userSpaceOnUse"><circle class="grid-dot" cx="1" cy="1" r="1"/></pattern>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path class="arrow" d="M0 0 10 5 0 10 2.5 5z"/></marker>
        <marker id="arrowS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path class="arrow-s" d="M0 0 10 5 0 10 2.5 5z"/></marker>
      </defs>
      <rect id="gridbg" width="100%" height="100%" fill="url(#gridp)"/>
      <g id="vp"><g id="g-edges"></g><g id="g-nodes"></g><g id="g-over"></g></g>
    </svg>
    <div class="hint" id="hint"><b>ダブルクリック</b>で画面を追加 ・ 画面の<b>青い点</b>をドラッグして遷移を作成 ・ <b>Shift+ドラッグ</b>で範囲選択</div>
  </main>

  <aside class="panel" id="panel" aria-label="プロパティ"></aside>
</div>

<div class="modal" id="modal" hidden><div class="dlg" role="dialog" aria-modal="true" id="dlg"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const svg = $('#cv'), vp = $('#vp'), gE = $('#g-edges'), gN = $('#g-nodes'), gO = $('#g-over'), panel = $('#panel');
const STORE = 'screenflow.doc.v1';
const COLORS = ['blue','teal','green','amber','rose','slate'];
const COLOR_LABEL = {blue:'青',teal:'青緑',green:'緑',amber:'黄',rose:'赤',slate:'灰'};
const DEVICES = {mobile:{w:200,min:280,label:'スマホ'},desktop:{w:320,min:190,label:'PC'},dialog:{w:220,min:110,label:'ダイアログ'}};
const TYPE_LABEL = {screen:'画面',decision:'分岐',start:'開始',end:'終了',note:'メモ'};
const HDR = 34;

let doc, view = {x:0,y:0,k:1}, sel = {nodes:new Set(), edge:null};
let undoS = [], redoS = [], editSnap = null, drag = null, spaceDown = false, lastDown = {t:0,key:''};

const uid = () => Math.random().toString(36).slice(2,9);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const snap = v => doc.settings.snap ? Math.round(v/10)*10 : Math.round(v);
const tw = (s,fs) => { let w = 0; for (const ch of s) w += /[\u0000-ÿ｡-ﾟ]/.test(ch) ? fs*0.58 : fs; return w; };
const fit = (s,maxW,fs) => { s = String(s ?? ''); if (tw(s,fs) <= maxW) return s; let o = ''; for (const ch of s) { if (tw(o+ch+'…',fs) > maxW) break; o += ch; } return o + '…'; };
const node = id => doc.nodes.find(n => n.id === id);
const edge = id => doc.edges.find(e => e.id === id);

/* ---------- sample ---------- */
function sampleDoc(){

function blankDoc(){ return {name:'無題の画面遷移図', settings:{edgeStyle:'ortho', snap:true}, nodes:[], edges:[]}; }
function normalize(d){
  if (!d || !Array.isArray(d.nodes) || !Array.isArray(d.edges)) throw new Error('nodes と edges の配列が必要です');
  d.name = String(d.name || '無題の画面遷移図');
  d.settings = Object.assign({edgeStyle:'ortho', snap:true}, d.settings || {});
  d.nodes = d.nodes.filter(n => n && n.id && TYPE_LABEL[n.type]).map(n => ({color:'blue',device:'mobile',title:'',desc:'',...n,x:+n.x||0,y:+n.y||0}));
  const ids = new Set(d.nodes.map(n => n.id));
  d.edges = d.edges.filter(e => e && e.id && ids.has(e.from) && ids.has(e.to) && e.from !== e.to).map(e => ({label:'',...e}));
  return d;
}

/* ---------- geometry ---------- */
function parseLines(desc){
  return String(desc || '').split('\n').map(raw => {
    const t = raw.trim();
    if (!t) return {k:'gap',h:8};
    if (t === '---') return {k:'hr',h:12};
    if (t.startsWith('# ')) return {k:'h',t:t.slice(2),h:26};
    if (/^\[.*\]$/.test(t)) return {k:'btn',t:t.slice(1,-1),h:36};
    if (/^\(.*\)$/.test(t)) return {k:'in',t:t.slice(1,-1),h:36};
    if (t.startsWith('- ')) return {k:'li',t:t.slice(2),h:28};
    if (t.startsWith('!')) return {k:'img',t:t.slice(1).trim(),h:68};
    return {k:'tx',t,h:20};
  });
}
function size(n){
  switch (n.type){
    case 'screen': { const d = DEVICES[n.device] || DEVICES.mobile; const body = parseLines(n.desc).reduce((a,l) => a+l.h, 0);
      return {w:d.w, h:Math.ceil(Math.max(d.min, HDR+12+body+(n.device==='mobile'?22:14))/10)*10}; }
    case 'decision': return {w:160,h:100};
    case 'note': { const c = n.desc ? String(n.desc).split('\n').length : 0; return {w:180,h:Math.ceil(Math.max(70, 40+c*18)/10)*10}; }
    default: return {w:130,h:44};
  }
}
function portPt(n,side){
  const {w,h} = size(n);
  return {top:{x:n.x+w/2,y:n.y,dx:0,dy:-1}, bottom:{x:n.x+w/2,y:n.y+h,dx:0,dy:1},
          left:{x:n.x,y:n.y+h/2,dx:-1,dy:0}, right:{x:n.x+w,y:n.y+h/2,dx:1,dy:0}}[side];
}
function autoSides(a,sa,b,sb){
  const ca = {x:a.x+sa.w/2,y:a.y+sa.h/2}, cb = {x:b.x+sb.w/2,y:b.y+sb.h/2};
  const dx = cb.x-ca.x, dy = cb.y-ca.y;
  const gapX = Math.abs(dx) - (sa.w+sb.w)/2, gapY = Math.abs(dy) - (sa.h+sb.h)/2;
  const horiz = gapX > 0 && gapY > 0 ? gapX*1.4 >= gapY : gapX >= gapY;
  return horiz ? (dx >= 0 ? ['right','left'] : ['left','right']) : (dy >= 0 ? ['bottom','top'] : ['top','bottom']);
}
function sidesFor(a,b){ return autoSides(a,size(a),b,size(b)); }

function roundPath(pts, r=10){
  const p = [];
  for (const q of pts){ const l = p[p.length-1]; if (l && Math.abs(l.x-q.x) < .5 && Math.abs(l.y-q.y) < .5) continue; p.push(q); }
  const c = [p[0]];
  for (let i = 1; i < p.length-1; i++){
    const a = c[c.length-1], b = p[i], n = p[i+1];
    if ((Math.abs(a.x-b.x) < .5 && Math.abs(b.x-n.x) < .5) || (Math.abs(a.y-b.y) < .5 && Math.abs(b.y-n.y) < .5)) continue;
    c.push(b);
  }
  if (p.length > 1) c.push(p[p.length-1]);
  const dist = (a,b) => Math.hypot(b.x-a.x, b.y-a.y);
  let d = `M${c[0].x} ${c[0].y}`;
  for (let i = 1; i < c.length-1; i++){
    const a = c[i-1], b = c[i], n = c[i+1];
    const l1 = dist(a,b), l2 = dist(b,n), rr = Math.min(r, l1/2, l2/2);
    const u1 = {x:(b.x-a.x)/l1, y:(b.y-a.y)/l1}, u2 = {x:(n.x-b.x)/l2, y:(n.y-b.y)/l2};
    d += ` L${b.x-u1.x*rr} ${b.y-u1.y*rr} Q${b.x} ${b.y} ${b.x+u2.x*rr} ${b.y+u2.y*rr}`;
  }
  d += ` L${c[c.length-1].x} ${c[c.length-1].y}`;
  return {d, pts:c};
}
function polyMid(pts){
  const segs = []; let tot = 0;
  for (let i = 1; i < pts.length; i++){ const l = Math.hypot(pts[i].x-pts[i-1].x, pts[i].y-pts[i-1].y); segs.push(l); tot += l; }
  let half = tot/2;
  for (let i = 0; i < segs.length; i++){
    if (half <= segs[i] || i === segs.length-1){ const t = segs[i] ? half/segs[i] : 0, a = pts[i], b = pts[i+1]; return {x:a.x+(b.x-a.x)*t, y:a.y+(b.y-a.y)*t}; }
    half -= segs[i];
  }
  return pts[0];
}
function pathBetween(p1,p2,style){
  const G = 22;
  if (style === 'straight') return {d:`M${p1.x} ${p1.y} L${p2.x} ${p2.y}`, mid:{x:(p1.x+p2.x)/2, y:(p1.y+p2.y)/2}};
  if (style === 'curve'){
    const k = Math.max(40, Math.hypot(p2.x-p1.x, p2.y-p1.y)/2.6);
    const c1 = {x:p1.x+p1.dx*k, y:p1.y+p1.dy*k}, c2 = {x:p2.x+p2.dx*k, y:p2.y+p2.dy*k};
    const m = {x:(p1.x+3*c1.x+3*c2.x+p2.x)/8, y:(p1.y+3*c1.y+3*c2.y+p2.y)/8};
    return {d:`M${p1.x} ${p1.y} C${c1.x} ${c1.y} ${c2.x} ${c2.y} ${p2.x} ${p2.y}`, mid:m};
  }
  const a = {x:p1.x+p1.dx*G, y:p1.y+p1.dy*G}, b = {x:p2.x+p2.dx*G, y:p2.y+p2.dy*G};
  const h1 = p1.dx !== 0, h2 = p2.dx !== 0;
  let pts;
  if (h1 && h2){ const mx = (a.x+b.x)/2; pts = [p1,a,{x:mx,y:a.y},{x:mx,y:b.y},b,p2]; }
  else if (!h1 && !h2){ const my = (a.y+b.y)/2; pts = [p1,a,{x:a.x,y:my},{x:b.x,y:my},b,p2]; }
  else if (h1){ pts = [p1,a,{x:b.x,y:a.y},b,p2]; }
  else { pts = [p1,a,{x:a.x,y:b.y},b,p2]; }
  const r = roundPath(pts);
  return {d:r.d, mid:polyMid(r.pts)};
}
function edgeGeom(e){
  const a = node(e.from), b = node(e.to);
  const [sa,sb] = sidesFor(a,b);
  const p1 = {...portPt(a,sa)}, p2 = {...portPt(b,sb)};
  if (doc.edges.some(o => o.from === e.to && o.to === e.from)){
    const off = e.from < e.to ? -10 : 10;
    if (p1.dx) p1.y += off; else p1.x += off;
    if (p2.dx) p2.y += off; else p2.x += off;
  }
  return pathBetween(p1,p2,doc.settings.edgeStyle);
}

/* ---------- render ---------- */
function nodeSVG(n, opts={}){
  const {w,h} = size(n), s = !opts.plain && sel.nodes.has(n.id), c = COLORS.includes(n.color) ? n.color : 'blue';
  let g = '';
  if (n.type === 'screen'){
    const dev = DEVICES[n.device] ? n.device : 'mobile', r = dev === 'mobile' ? 16 : dev === 'desktop' ? 6 : 10;
    g += `<rect class="frame${dev==='dialog'?' fdlg':''}" width="${w}" height="${h}" rx="${r}"/>`;
    g += `<path class="hb-${c}" d="M0 ${r} a${r} ${r} 0 0 1 ${r} -${r} h${w-2*r} a${r} ${r} 0 0 1 ${r} ${r} v${HDR-r} h-${w} z"/>`;
    let tx = 12;
    if (dev === 'desktop'){ g += [12,22,32].map(x => `<circle class="dot3" cx="${x}" cy="${HDR/2}" r="3"/>`).join(''); tx = 46; }
    g += `<text class="ttl" x="${tx}" y="${HDR/2+4.5}">${esc(fit(n.title || '無題の画面', w-tx-12, 13))}</text>`;
    const pad = 12, iw = w - pad*2; let y = HDR + 12;
    for (const l of parseLines(n.desc)){
      switch (l.k){
        case 'h': g += `<text class="wf-h" x="${pad}" y="${y+18}">${esc(fit(l.t,iw,14))}</text>`; break;
        case 'tx': g += `<text class="wf-t" x="${pad}" y="${y+14}">${esc(fit(l.t,iw,12))}</text>`; break;
        case 'btn': g += `<rect class="hs-${c}" x="${pad}" y="${y+4}" width="${iw}" height="28" rx="6"/><text class="wf-bt" x="${w/2}" y="${y+22}" text-anchor="middle">${esc(fit(l.t,iw-16,12))}</text>`; break;
        case 'in': g += `<rect class="wf-in" x="${pad}" y="${y+4}" width="${iw}" height="28" rx="5"/><text class="wf-it" x="${pad+9}" y="${y+22}">${esc(fit(l.t,iw-18,12))}</text>`; break;
        case 'li': g += `<text class="wf-t" x="${pad}" y="${y+18}" style="fill:var(--ink)">${esc(fit(l.t,iw-18,12))}</text><path class="wf-chev" d="M${w-pad-6} ${y+9} l4 5 -4 5"/><path class="wf-li" d="M${pad} ${y+27.5} H${w-pad}"/>`; break;
        case 'img': g += `<rect class="wf-img" x="${pad}" y="${y+2}" width="${iw}" height="62" rx="5"/><path class="wf-x" d="M${pad} ${y+2} L${pad+iw} ${y+64} M${pad+iw} ${y+2} L${pad} ${y+64}"/>` + (l.t ? `<rect x="${w/2-tw(fit(l.t,iw-24,11),11)/2-6}" y="${y+24}" width="${tw(fit(l.t,iw-24,11),11)+12}" height="18" rx="4" class="wf-img"/><text class="wf-il" x="${w/2}" y="${y+37}" text-anchor="middle">${esc(fit(l.t,iw-24,11))}</text>` : ''); break;
        case 'hr': g += `<path class="wf-li" d="M${pad} ${y+6.5} H${w-pad}"/>`; break;
      }
      y += l.h;
    }
    if (dev === 'mobile') g += `<rect class="wf-home" x="${w/2-26}" y="${h-10}" width="52" height="4" rx="2"/>`;
  } else if (n.type === 'decision'){
    g += `<path class="frame dec ks-${c}" style="fill:var(--${c}-t)" d="M${w/2} 0 L${w} ${h/2} L${w/2} ${h} L0 ${h/2} Z"/>`;
    g += `<text class="term-t" x="${w/2}" y="${h/2+4.5}" text-anchor="middle">${esc(fit(n.title || '条件？', w-50, 13))}</text>`;
  } else if (n.type === 'start' || n.type === 'end'){
    g += `<rect class="term ks-${c}" width="${w}" height="${h}" rx="${h/2}"/>`;
    if (n.type === 'end') g += `<rect class="term ks-${c}" x="4" y="4" width="${w-8}" height="${h-8}" rx="${h/2-4}" style="fill:var(--${c}-t)"/>`;
    else g += `<circle class="hs-${c}" cx="20" cy="${h/2}" r="5"/>`;
    g += `<text class="term-t" x="${w/2 + (n.type==='start'?6:0)}" y="${h/2+4.5}" text-anchor="middle">${esc(fit(n.title || TYPE_LABEL[n.type], w-40, 13))}</text>`;
  } else if (n.type === 'note'){
    g += `<path class="note-b" d="M0 0 H${w} V${h-16} L${w-16} ${h} H0 Z"/><path class="note-f" d="M${w} ${h-16} H${w-16} V${h} Z"/>`;
    g += `<text class="note-h" x="12" y="22">${esc(fit(n.title || 'メモ', w-24, 12))}</text>`;
    String(n.desc || '').split('\n').forEach((t,i) => { g += `<text class="note-t" x="12" y="${44+i*18}">${esc(fit(t, w-28, 12))}</text>`; });
  }
  if (s) g = `<rect class="selbox" x="-5" y="-5" width="${w+10}" height="${h+10}" rx="8"/>` + g;
  if (!opts.plain) g += [['top',w/2,0],['right',w,h/2],['bottom',w/2,h],['left',0,h/2]].map(([sd,x,y]) => `<circle class="port" data-port="${n.id}" data-side="${sd}" cx="${x}" cy="${y}" r="6"/>`).join('');
  return `<g class="node${s?' sel':''}" data-node="${n.id}" transform="translate(${n.x} ${n.y})">${g}</g>`;
}
function edgeSVG(e, opts={}){
  const {d, mid} = edgeGeom(e), s = !opts.plain && sel.edge === e.id;
  let lab = '';
  if (e.label){
    const t = fit(e.label, 180, 11), w = tw(t,11) + 14;
    lab = `<g class="elabel"><rect x="${mid.x-w/2}" y="${mid.y-10}" width="${w}" height="20" rx="10"/><text x="${mid.x}" y="${mid.y+4}" text-anchor="middle">${esc(t)}</text></g>`;
  }
  return `<g class="edge${s?' sel':''}" data-edge="${e.id}">${opts.plain?'':`<path class="hit" d="${d}"/>`}<path class="ln${e.dashed?' dash':''}" d="${d}" marker-end="url(#arrow${s?'S':''})"/>${lab}</g>`;
}

let saveT = 0;
function render(){
  vp.setAttribute('transform', `translate(${view.x} ${view.y}) scale(${view.k})`);
  const gp = $('#gridp'), gs = 20*view.k;
  gp.setAttribute('width', gs); gp.setAttribute('height', gs);
  gp.setAttribute('x', view.x % gs); gp.setAttribute('y', view.y % gs);
  gp.firstElementChild.setAttribute('r', clamp(view.k, .6, 1.4));
  $('#gridbg').style.display = view.k < .35 ? 'none' : '';
  gE.innerHTML = doc.edges.map(e => edgeSVG(e)).join('');
  gN.innerHTML = doc.nodes.map(n => nodeSVG(n)).join('');
  $('#zoomv').textContent = Math.round(view.k*100) + '%';
  $('#b-undo').disabled = !undoS.length; $('#b-redo').disabled = !redoS.length;
  if (document.activeElement !== $('#docname')) $('#docname').value = doc.name;
  clearTimeout(saveT); saveT = setTimeout(save, 300);
}
function save(){ try { localStorage.setItem(STORE, JSON.stringify(doc)); } catch {} }

/* ---------- history ---------- */
function commit(){ undoS.push(JSON.stringify(doc)); if (undoS.length > 200) undoS.shift(); redoS = []; }
function pruneSel(){ sel.nodes = new Set([...sel.nodes].filter(node)); if (sel.edge && !edge(sel.edge)) sel.edge = null; }
function undo(){ if (!undoS.length) return; redoS.push(JSON.stringify(doc)); doc = JSON.parse(undoS.pop()); pruneSel(); render(); renderPanel(); }
function redo(){ if (!redoS.length) return; undoS.push(JSON.stringify(doc)); doc = JSON.parse(redoS.pop()); pruneSel(); render(); renderPanel(); }

/* ---------- actions ---------- */
function makeNode(kind, x, y){
  const base = {id:uid(), x:0, y:0, color:'blue', device:'mobile', title:'', desc:''};
  const map = {
    mobile:{type:'screen',device:'mobile',title:'新しい画面',desc:'# 見出し\nテキスト\n[ボタン]'},
    desktop:{type:'screen',device:'desktop',title:'新しい画面',desc:'# 見出し\n!メイン画像\n- 項目1\n- 項目2'},
    dialog:{type:'screen',device:'dialog',title:'確認',desc:'本当に削除しますか？\n[OK]',color:'rose'},
    decision:{type:'decision',title:'条件？',color:'amber'},
    start:{type:'start',title:'開始',color:'green'},
    end:{type:'end',title:'終了',color:'slate'},
    note:{type:'note',title:'メモ',desc:'補足事項を書きます'}
  };
  const n = {...base, ...map[kind]};
  const {w,h} = size(n);
  n.x = snap(x - w/2); n.y = snap(y - Math.min(h/2, 40));
  return n;
}
function addNode(kind, x, y){
  commit(); const n = makeNode(kind, x, y); doc.nodes.push(n);
  sel.nodes = new Set([n.id]); sel.edge = null; render(); renderPanel(true);
  return n;
}
function viewCenter(){ const r = svg.getBoundingClientRect(); return {x:(r.width/2 - view.x)/view.k, y:(r.height/2 - view.y)/view.k}; }
function deleteSel(){
  if (!sel.nodes.size && !sel.edge) return;
  commit();
  if (sel.edge) doc.edges = doc.edges.filter(e => e.id !== sel.edge);
  if (sel.nodes.size){ doc.nodes = doc.nodes.filter(n => !sel.nodes.has(n.id)); doc.edges = doc.edges.filter(e => !sel.nodes.has(e.from) && !sel.nodes.has(e.to)); }
  sel = {nodes:new Set(), edge:null}; render(); renderPanel();
}
function duplicateSel(){
  if (!sel.nodes.size) return;
  commit(); const idMap = {};
  const copies = [...sel.nodes].map(id => { const n = JSON.parse(JSON.stringify(node(id))); idMap[id] = n.id = uid(); n.x += 30; n.y += 30; return n; });
  const ecopies = doc.edges.filter(e => idMap[e.from] && idMap[e.to]).map(e => ({...e, id:uid(), from:idMap[e.from], to:idMap[e.to]}));
  doc.nodes.push(...copies); doc.edges.push(...ecopies);
  sel.nodes = new Set(copies.map(n => n.id)); sel.edge = null; render(); renderPanel();
}
function connect(from, to){
  if (from === to) return null;
  const ex = doc.edges.find(e => e.from === from && e.to === to);
  if (ex) return ex;
  const e = {id:uid(), from, to, label:''}; doc.edges.push(e); return e;
}
function bbox(){
  if (!doc.nodes.length) return null;
  let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
  for (const n of doc.nodes){ const {w,h} = size(n); x1 = Math.min(x1,n.x); y1 = Math.min(y1,n.y); x2 = Math.max(x2,n.x+w); y2 = Math.max(y2,n.y+h); }
  return {x:x1, y:y1, w:x2-x1, h:y2-y1};
}
function fitView(){
  const r = svg.getBoundingClientRect(), b = bbox();
  if (!b || !r.width){ view = {x:r.width/2||200, y:r.height/2||200, k:1}; render(); return; }
  const pad = 48, k = clamp(Math.min((r.width-pad*2)/b.w, (r.height-pad*2)/b.h), .2, 1.2);
  view = {k, x:(r.width - b.w*k)/2 - b.x*k, y:(r.height - b.h*k)/2 - b.y*k};
  render();
}
function zoomAt(px, py, f){
  const k = clamp(view.k*f, .2, 3);
  view.x = px - (px - view.x)*k/view.k; view.y = py - (py - view.y)*k/view.k; view.k = k; render();
}
function zoomCenter(f){ const r = svg.getBoundingClientRect(); zoomAt(r.width/2, r.height/2, f); }
function align(mode){
  const ns = [...sel.nodes].map(node); if (ns.length < 2) return;
  commit();
  if (mode === 'left'){ const x = Math.min(...ns.map(n => n.x)); ns.forEach(n => n.x = x); }
  if (mode === 'top'){ const y = Math.min(...ns.map(n => n.y)); ns.forEach(n => n.y = y); }
  if (mode === 'middle'){ const cy = Math.min(...ns.map(n => n.y + size(n).h/2)); ns.forEach(n => n.y = snap(cy - size(n).h/2)); }
  if (mode === 'hspace'){
    ns.sort((a,b) => a.x - b.x);
    const tot = ns.reduce((a,n) => a + size(n).w, 0), span = ns[ns.length-1].x + size(ns[ns.length-1]).w - ns[0].x;
    const gap = Math.max(40, (span - tot)/(ns.length-1)); let x = ns[0].x;
    ns.forEach(n => { n.x = snap(x); x += size(n).w + gap; });
  }
  render();
}

/* ---------- pointer ---------- */
function toLocal(e){ const r = svg.getBoundingClientRect(); return {x:e.clientX - r.left, y:e.clientY - r.top}; }
function toWorld(e){ const p = toLocal(e); return {x:(p.x - view.x)/view.k, y:(p.y - view.y)/view.k}; }
function nodeAt(e){ const el = document.elementFromPoint(e.clientX, e.clientY); return el && el.closest ? el.closest('[data-node]') : null; }

svg.addEventListener('pointerdown', e => {
  if (e.button === 2) return;
  const w = toWorld(e), t = e.target;
  const portEl = t.closest('[data-port]'), nodeEl = t.closest('[data-node]'), edgeEl = t.closest('[data-edge]');
  const key = portEl ? '' : nodeEl ? 'n:'+nodeEl.dataset.node : edgeEl ? 'e:'+edgeEl.dataset.edge : 'bg';
  const now = Date.now(), dbl = key && key === lastDown.key && now - lastDown.t < 350;
  lastDown = {t: dbl ? 0 : now, key};
  try { svg.setPointerCapture(e.pointerId); } catch {}
  if (e.button === 1 || spaceDown){ drag = {m:'pan', sx:e.clientX, sy:e.clientY, vx:view.x, vy:view.y}; svg.classList.add('panning'); return; }
  if (portEl){ drag = {m:'conn', from:portEl.dataset.port, w}; svg.classList.add('connecting'); return; }
  if (nodeEl){
    const id = nodeEl.dataset.node;
    if (e.shiftKey){ sel.nodes.has(id) ? sel.nodes.delete(id) : sel.nodes.add(id); }
    else if (!sel.nodes.has(id)) sel.nodes = new Set([id]);
    sel.edge = null;
    drag = {m:'move', w, start:new Map([...sel.nodes].map(i => [i, {x:node(i).x, y:node(i).y}])), moved:false, snapState:JSON.stringify(doc)};
    render(); renderPanel();
    if (dbl){ drag = null; focusField('#p-title'); }
    return;
  }
  if (edgeEl){
    sel.nodes.clear(); sel.edge = edgeEl.dataset.edge; render(); renderPanel();
    if (dbl) focusField('#p-label');
    drag = null; return;
  }
  if (dbl){ addNode('mobile', w.x, w.y); focusField('#p-title'); drag = null; return; }
  if (e.shiftKey){ drag = {m:'box', w, base:new Set(sel.nodes)}; return; }
  if (sel.nodes.size || sel.edge){ sel = {nodes:new Set(), edge:null}; render(); renderPanel(); }
  drag = {m:'pan', sx:e.clientX, sy:e.clientY, vx:view.x, vy:view.y}; svg.classList.add('panning');
});
svg.addEventListener('pointermove', e => {
  if (!drag) return;
  if (drag.m === 'pan'){ view.x = drag.vx + e.clientX - drag.sx; view.y = drag.vy + e.clientY - drag.sy; render(); return; }
  const w = toWorld(e);
  if (drag.m === 'move'){
    const dx = w.x - drag.w.x, dy = w.y - drag.w.y;
    if (!drag.moved && Math.hypot(dx,dy) < 3/view.k) return;
    drag.moved = true;
    for (const [id,p] of drag.start){ const n = node(id); n.x = snap(p.x+dx); n.y = snap(p.y+dy); }
    render(); return;
  }
  if (drag.m === 'conn'){
    const a = node(drag.from), tgtEl = nodeAt(e);
    gN.querySelectorAll('.node.target').forEach(el => el.classList.remove('target'));
    const tid = tgtEl && tgtEl.dataset.node !== drag.from ? tgtEl.dataset.node : null;
    let p2, p1;
    if (tid){ tgtEl.classList.add('target'); const b = node(tid), [sa,sb] = sidesFor(a,b); p1 = portPt(a,sa); p2 = portPt(b,sb); }
    else { const [sa] = autoSides(a,size(a),{x:w.x,y:w.y},{w:0,h:0}); p1 = portPt(a,sa); p2 = {x:w.x,y:w.y,dx:-p1.dx,dy:-p1.dy}; }
    gO.innerHTML = `<path class="tmp" d="${pathBetween(p1,p2,doc.settings.edgeStyle).d}" marker-end="url(#arrowS)"/>`;
    return;
  }
  if (drag.m === 'box'){
    const x = Math.min(w.x, drag.w.x), y = Math.min(w.y, drag.w.y), bw = Math.abs(w.x-drag.w.x), bh = Math.abs(w.y-drag.w.y);
    gO.innerHTML = `<rect class="boxsel" x="${x}" y="${y}" width="${bw}" height="${bh}"/>`;
    sel.nodes = new Set(drag.base);
    for (const n of doc.nodes){ const s = size(n); if (n.x < x+bw && n.x+s.w > x && n.y < y+bh && n.y+s.h > y) sel.nodes.add(n.id); }
    render();
  }
});
function endDrag(e){
  if (!drag) return;
  const d = drag; drag = null;
  svg.classList.remove('panning','connecting');
  if (d.m === 'move' && d.moved){ undoS.push(d.snapState); redoS = []; render(); renderPanel(); }
  if (d.m === 'conn'){
    gO.innerHTML = '';
    const tgtEl = e.type === 'pointerup' ? nodeAt(e) : null;
    if (tgtEl && tgtEl.dataset.node !== d.from){
      commit(); const ed = connect(d.from, tgtEl.dataset.node);
      sel = {nodes:new Set(), edge:ed.id}; render(); renderPanel(); focusField('#p-label');
    } else if (!tgtEl && e.type === 'pointerup'){
      const w = toWorld(e);
      if (Math.hypot(w.x-d.w.x, w.y-d.w.y) > 30){
        commit(); const src = node(d.from);
        const n = makeNode(src.type === 'screen' ? (src.device || 'mobile') : 'mobile', w.x, w.y);
        if (src.type === 'screen') n.color = src.color;
        doc.nodes.push(n); connect(d.from, n.id);
        sel = {nodes:new Set([n.id]), edge:null}; render(); renderPanel(); focusField('#p-title');
      } else render();
    } else render();
  }
  if (d.m === 'box'){ gO.innerHTML = ''; renderPanel(); }
}
svg.addEventListener('pointerup', endDrag);
svg.addEventListener('pointercancel', endDrag);
svg.addEventListener('wheel', e => {
  e.preventDefault();
  if (e.ctrlKey || e.metaKey){ const p = toLocal(e); zoomAt(p.x, p.y, Math.exp(-e.deltaY*0.01)); }
  else { view.x -= e.shiftKey ? e.deltaY : e.deltaX; view.y -= e.shiftKey ? 0 : e.deltaY; render(); }
}, {passive:false});
svg.addEventListener('contextmenu', e => e.preventDefault());

/* palette: click adds at center, drag drops at pointer */
document.querySelectorAll('[data-add]').forEach(el => {
  el.addEventListener('click', () => { const c = viewCenter(); const off = (doc.nodes.length % 5) * 20; addNode(el.dataset.add, c.x + off, c.y + off); });
  el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); el.click(); } });
  el.addEventListener('dragstart', e => { e.dataTransfer.setData('text/x-screenflow', el.dataset.add); e.dataTransfer.effectAllowed = 'copy'; });
});
svg.addEventListener('dragover', e => { if ([...e.dataTransfer.types].includes('text/x-screenflow')){ e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; } });
svg.addEventListener('drop', e => { const k = e.dataTransfer.getData('text/x-screenflow'); if (!k) return; e.preventDefault(); const w = toWorld(e); addNode(k, w.x, w.y); });

/* ---------- keyboard ---------- */
window.addEventListener('keydown', e => {
  const inField = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName) || !$('#modal').hidden;
  const mod = e.ctrlKey || e.metaKey;
  if (e.key === 'Escape' && !$('#modal').hidden){ closeModal(); return; }
  if (inField) return;
  if (e.code === 'Space'){ spaceDown = true; e.preventDefault(); return; }
  if (mod && e.key.toLowerCase() === 'z'){ e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && e.key.toLowerCase() === 'y'){ e.preventDefault(); redo(); return; }
  if (mod && e.key.toLowerCase() === 'd'){ e.preventDefault(); duplicateSel(); return; }
  if (mod && e.key.toLowerCase() === 'a'){ e.preventDefault(); sel = {nodes:new Set(doc.nodes.map(n => n.id)), edge:null}; render(); renderPanel(); return; }
  if (e.key === 'Delete' || e.key === 'Backspace'){ e.preventDefault(); deleteSel(); return; }
  if (e.key === 'Escape'){ sel = {nodes:new Set(), edge:null}; render(); renderPanel(); return; }
  if (e.key === '0' && mod){ e.preventDefault(); fitView(); return; }
  if ((e.key === '+' || e.key === '=') && !mod){ zoomCenter(1.2); return; }
  if (e.key === '-' && !mod){ zoomCenter(1/1.2); return; }
  const arrows = {ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]};
  if (arrows[e.key] && sel.nodes.size){
    e.preventDefault(); commit(); const st = e.shiftKey ? 1 : 10;
    sel.nodes.forEach(id => { const n = node(id); n.x += arrows[e.key][0]*st; n.y += arrows[e.key][1]*st; });
    render();
  }
});
window.addEventListener('keyup', e => { if (e.code === 'Space') spaceDown = false; });

/* ---------- inspector ---------- */
function focusField(sel){ requestAnimationFrame(() => { const el = $(sel); if (el){ panel.classList.remove('closed'); el.focus(); el.select && el.select(); } }); }
function bindEdit(el, apply){
  el.addEventListener('focus', () => { editSnap = JSON.stringify(doc); });
  el.addEventListener('input', () => { if (editSnap){ undoS.push(editSnap); redoS = []; editSnap = null; } apply(el.value); render(); });
  el.addEventListener('blur', () => { editSnap = null; });
}
function seg(id, opts, cur){ return `<div class="seg" id="${id}" role="group">${opts.map(([v,l]) => `<button type="button" data-v="${v}" aria-pressed="${v===cur}">${l}</button>`).join('')}</div>`; }
function bindSeg(id, fn){ const el = $('#'+id); if (!el) return; el.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; commit(); fn(b.dataset.v); render(); renderPanel(); }); }
function swatches(cur){ return `<div class="fld"><span class="lb">色</span><div class="sw" id="p-color">${COLORS.map(c => `<button type="button" data-v="${c}" title="${COLOR_LABEL[c]}" aria-label="${COLOR_LABEL[c]}" aria-pressed="${c===cur}" style="background:var(--${c})"></button>`).join('')}</div></div>`; }

function renderPanel(){
  const ns = [...sel.nodes].map(node).filter(Boolean);
  let h = '';
  if (ns.length === 1){
    const n = ns[0];
    h += `<div class="kind">${esc(TYPE_LABEL[n.type])}<span class="chip">${n.type === 'screen' ? esc(DEVICES[n.device]?.label || '') : n.type.toUpperCase()}</span></div>`;
    h += `<div class="fld"><label for="p-title">${n.type === 'decision' ? '条件' : n.type === 'screen' ? '画面名' : 'ラベル'}</label><input type="text" id="p-title" value="${esc(n.title)}"></div>`;
    if (n.type === 'screen'){
      h += `<div class="fld"><span class="lb">種類</span>${seg('p-device', Object.entries(DEVICES).map(([k,v]) => [k,v.label]), n.device)}</div>`;
      h += `<div class="fld"><label for="p-desc">画面の中身（1行＝1要素）</label><textarea id="p-desc" spellcheck="false">${esc(n.desc)}</textarea></div>`;
      h += `<div class="syntax"><code># 見出し</code><span>見出し</span><code>[ログイン]</code><span>ボタン</span><code>(メール)</code><span>入力欄</span><code>- 項目</code><span>リスト</span><code>!画像</code><span>画像枠</span><code>---</code><span>区切り線</span><code>文章</code><span>テキスト</span></div>`;
    }
    if (n.type === 'note') h += `<div class="fld"><label for="p-desc">本文</label><textarea id="p-desc" spellcheck="false" style="font-family:var(--f-ui)">${esc(n.desc)}</textarea></div>`;
    h += swatches(n.color);
    const outs = doc.edges.filter(e => e.from === n.id), ins = doc.edges.filter(e => e.to === n.id);
    if (outs.length || ins.length){
      h += `<div class="fld"><span class="lb">遷移</span><ul class="trans">`;
      h += outs.map(e => `<li><span>→</span><span>${esc(node(e.to).title || TYPE_LABEL[node(e.to).type])}</span>${e.label ? `<span class="lbl">${esc(e.label)}</span>` : ''}</li>`).join('');
      h += ins.map(e => `<li><span>←</span><span>${esc(node(e.from).title || TYPE_LABEL[node(e.from).type])}</span>${e.label ? `<span class="lbl">${esc(e.label)}</span>` : ''}</li>`).join('');
      h += `</ul></div>`;
    }
    h += `<div class="row"><button class="btn" id="p-dup">複製 (Ctrl+D)</button><button class="btn danger" id="p-del">削除</button></div>`;
  } else if (ns.length > 1){
    h += `<div class="kind">${ns.length} 個を選択中</div>`;
    h += `<div class="fld"><span class="lb">整列</span><div class="row"><button class="btn" data-al="left">左揃え</button><button class="btn" data-al="top">上揃え</button><button class="btn" data-al="middle">中央揃え</button><button class="btn" data-al="hspace">横に等間隔</button></div></div>`;
    h += swatches(ns.every(n => n.color === ns[0].color) ? ns[0].color : '');
    h += `<div class="row"><button class="btn" id="p-dup">複製</button><button class="btn danger" id="p-del">削除</button></div>`;
  } else if (sel.edge && edge(sel.edge)){
    const e = edge(sel.edge), a = node(e.from), b = node(e.to);
    h += `<div class="kind">遷移<span class="chip">EDGE</span></div>`;
    h += `<ul class="trans"><li><span>${esc(a.title || TYPE_LABEL[a.type])}</span><span>→</span><span>${esc(b.title || TYPE_LABEL[b.type])}</span></li></ul>`;
    h += `<div class="fld"><label for="p-label">きっかけ（操作・条件）</label><input type="text" id="p-label" value="${esc(e.label)}" placeholder="例：ログインボタンを押す"></div>`;
    h += `<div class="fld"><span class="lb">線の種類</span>${seg('p-dash', [['0','実線（通常）'],['1','破線（例外・戻り）']], e.dashed ? '1' : '0')}</div>`;
    h += `<div class="row"><button class="btn" id="p-rev">向きを反転</button><button class="btn danger" id="p-del">削除</button></div>`;
  } else {
    const screens = doc.nodes.filter(n => n.type === 'screen').length;
    h += `<h2>この図</h2><div class="stats"><div class="stat"><b>${screens}</b><span>画面</span></div><div class="stat"><b>${doc.edges.length}</b><span>遷移</span></div></div>`;
    h += `<div class="fld"><span class="lb">線の引き方</span>${seg('p-style', [['ortho','直角'],['curve','曲線'],['straight','直線']], doc.settings.edgeStyle)}</div>`;
    h += `<label class="chk"><input type="checkbox" id="p-snap" ${doc.settings.snap ? 'checked' : ''}> グリッドに吸着（10px）</label>`;
    h += `<h2>操作</h2><dl class="keys">
      <dt>ダブルクリック</dt><dd>空白に画面を追加／図形や線を編集</dd>
      <dt>青い点をドラッグ</dt><dd>遷移を作成（空白で離すと次の画面ごと作成）</dd>
      <dt>ドラッグ</dt><dd>空白で画面を移動、図形で配置を変更</dd>
      <dt>Shift+ドラッグ</dt><dd>範囲選択</dd>
      <dt>Ctrl+ホイール</dt><dd>拡大・縮小</dd>
      <dt>Delete</dt><dd>選択を削除</dd>
      <dt>Ctrl+Z / Shift+Z</dt><dd>元に戻す／やり直し</dd>
      <dt>矢印キー</dt><dd>10px移動（Shiftで1px）</dd></dl>`;
    h += `<p class="note" style="margin:0;font-size:11px;color:var(--ink-2)">内容はこのブラウザに自動保存されます。共有するときは「書き出し」からJSONを保存してください。</p>`;
  }
  panel.innerHTML = h;
  if (window.matchMedia('(max-width:760px)').matches) panel.classList.toggle('closed', !ns.length && !sel.edge && !panel.dataset.open);

  const t = $('#p-title'); if (t) bindEdit(t, v => ns[0].title = v);
  const d = $('#p-desc'); if (d) bindEdit(d, v => ns[0].desc = v);
  const l = $('#p-label'); if (l) bindEdit(l, v => edge(sel.edge).label = v);
  bindSeg('p-device', v => ns[0].device = v);
  bindSeg('p-dash', v => edge(sel.edge).dashed = v === '1');
  bindSeg('p-style', v => doc.settings.edgeStyle = v);
  const sw = $('#p-color'); if (sw) sw.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; commit(); ns.forEach(n => n.color = b.dataset.v); render(); renderPanel(); });
  const sn = $('#p-snap'); if (sn) sn.addEventListener('change', () => { doc.settings.snap = sn.checked; save(); });
  const dup = $('#p-dup'); if (dup) dup.onclick = duplicateSel;
  const del = $('#p-del'); if (del) del.onclick = deleteSel;
  const rev = $('#p-rev'); if (rev) rev.onclick = () => { const e = edge(sel.edge); commit(); [e.from, e.to] = [e.to, e.from]; render(); renderPanel(); };
  panel.querySelectorAll('[data-al]').forEach(b => b.onclick = () => align(b.dataset.al));
}

/* ---------- modal, export, import ---------- */
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2400); }
function openModal(html){ $('#dlg').innerHTML = html; $('#modal').hidden = false; }
function closeModal(){ $('#modal').hidden = true; }
$('#modal').addEventListener('pointerdown', e => { if (e.target === $('#modal')) closeModal(); });
function copyText(text, ta){
  const fallback = () => { if (ta){ ta.focus(); ta.select(); } toast('選択しました。Ctrl+C でコピーしてください'); };
  try { navigator.clipboard.writeText(text).then(() => toast('コピーしました'), fallback); } catch { fallback(); }
}
function download(name, href){ try { const a = document.createElement('a'); a.href = href; a.download = name; document.body.appendChild(a); a.click(); a.remove(); } catch {} }
const fileBase = () => (doc.name || 'screenflow').replace(/[\\/:*?"<>|]/g, '_');

function exportSVG(){
  const b = bbox() || {x:0,y:0,w:200,h:120}, pad = 32;
  const cs = getComputedStyle(document.documentElement);
  const vars = ['paper','surface','ink','ink-2','line','grid','accent','accent-t','edge','screen','wf','on-solid','f-ui','f-mono', ...COLORS.flatMap(c => [c, c+'-t'])].map(k => `--${k}:${cs.getPropertyValue('--'+k).trim()}`).join(';');
  const defs = svg.querySelector('defs').innerHTML;
  const body = doc.edges.map(e => edgeSVG(e,{plain:true})).join('') + doc.nodes.map(n => nodeSVG(n,{plain:true})).join('');
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${b.x-pad} ${b.y-pad} ${b.w+pad*2} ${b.h+pad*2}" width="${b.w+pad*2}" height="${b.h+pad*2}"><style>svg{${vars}}${$('#dcss').textContent}</style><defs>${defs}</defs><rect x="${b.x-pad}" y="${b.y-pad}" width="${b.w+pad*2}" height="${b.h+pad*2}" style="fill:var(--paper)"/>${body}</svg>`;
}
function exportMermaid(){
  const q = s => '"' + String(s || '').replace(/"/g, '#quot;') + '"';
  const shape = n => n.type === 'decision' ? `{${q(n.title)}}` : (n.type === 'start' || n.type === 'end') ? `([${q(n.title)}])` : n.type === 'note' ? `>${q(n.title + (n.desc ? ': ' + n.desc.replace(/\n/g,' ') : ''))}]` : `[${q(n.title)}]`;
  const id = n => 'n_' + n.id.replace(/[^\w]/g, '');
  const lines = ['flowchart LR', ...doc.nodes.map(n => `  ${id(n)}${shape(n)}`), ...doc.edges.map(e => `  ${id(node(e.from))} ${e.dashed ? '-.->' : '-->'}${e.label ? '|' + q(e.label) + '|' : ''} ${id(node(e.to))}`)];
  return lines.join('\n');
}
function showExport(tab='json'){
  const tabs = [['json','JSON（保存用）'],['png','PNG画像'],['svg','SVG'],['mermaid','Mermaid']];
  let body = '';
  if (tab === 'png') body = `<p class="note">画像を作成しています…</p><img id="x-img" alt="書き出した画面遷移図">`;
  else body = `<textarea id="x-text" readonly spellcheck="false"></textarea>`;
  const notes = {json:'あとで「読み込み」から続きを編集できます。', png:'画像を右クリック（長押し）でも保存できます。', svg:'ベクター形式。Figmaやドキュメントに貼り付けられます。', mermaid:'GitHubのREADMEやNotionの ```mermaid ブロックに貼り付けると図として表示されます。'};
  openModal(`<header><h4>書き出し</h4><button class="tb" id="x-close" aria-label="閉じる">✕</button></header>
    <div class="tabs">${tabs.map(([k,l]) => `<button class="btn" data-tab="${k}" style="${k===tab?'border-color:var(--accent);color:var(--accent)':''}">${l}</button>`).join('')}</div>
    <p class="note">${notes[tab]}</p>${body}
    <div class="row"><button class="btn" id="x-copy" ${tab==='png'?'hidden':''}>コピー</button><button class="btn" id="x-dl">ファイルに保存</button></div>`);
  $('#x-close').onclick = closeModal;
  if (window.self !== window.top) $('#x-dl').hidden = true; // 埋め込み表示ではダウンロード不可
  document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => showExport(b.dataset.tab));
  if (tab === 'png'){
    const s = exportSVG(), img = new Image();
    img.onload = () => {
      const sc = 2, c = document.createElement('canvas'); c.width = img.width*sc; c.height = img.height*sc;
      const ctx = c.getContext('2d'); ctx.scale(sc,sc); ctx.drawImage(img,0,0);
      let url; try { url = c.toDataURL('image/png'); } catch { url = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(s); }
      const el = $('#x-img'); if (!el) return; el.src = url; el.previousElementSibling.remove();
      $('#x-dl').onclick = () => download(fileBase() + '.png', url);
    };
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(s);
    return;
  }
  const text = tab === 'json' ? JSON.stringify(doc, null, 2) : tab === 'svg' ? exportSVG() : exportMermaid();
  const ta = $('#x-text'); ta.value = text;
  $('#x-copy').onclick = () => copyText(text, ta);
  const mime = {json:'application/json', svg:'image/svg+xml', mermaid:'text/plain'}[tab], ext = {json:'json', svg:'svg', mermaid:'mmd'}[tab];
  $('#x-dl').onclick = () => download(`${fileBase()}.${ext}`, URL.createObjectURL(new Blob([text], {type:mime})));
}
function showImport(){
  openModal(`<header><h4>読み込み</h4><button class="tb" id="i-close" aria-label="閉じる">✕</button></header>
    <p class="note">「書き出し」で保存したJSONファイルを選ぶか、中身を貼り付けてください。今の図は「元に戻す」で復元できます。</p>
    <input type="file" id="i-file" accept=".json,application/json">
    <textarea id="i-text" spellcheck="false" placeholder='{"name": "...", "nodes": [...], "edges": [...]}'></textarea>
    <p class="note" id="i-err" hidden style="color:var(--rose)"></p>
    <div class="row"><button class="tb primary" id="i-go">読み込む</button><button class="btn" id="i-sample">サンプルを開く</button></div>`);
  $('#i-close').onclick = closeModal;
  $('#i-file').onchange = e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { $('#i-text').value = r.result; }; r.readAsText(f); };
  const load = d => { commit(); doc = d; sel = {nodes:new Set(), edge:null}; closeModal(); fitView(); renderPanel(); toast('読み込みました'); };
  $('#i-go').onclick = () => {
    try { load(normalize(JSON.parse($('#i-text').value))); }
    catch (err){ const el = $('#i-err'); el.hidden = false; el.textContent = '読み込めませんでした：' + (err.message || err) + '。書き出したJSONをそのまま貼り付けてください。'; }
  };
  $('#i-sample').onclick = () => load(sampleDoc());
}

/* ---------- toolbar ---------- */
$('#b-undo').onclick = undo; $('#b-redo').onclick = redo;
$('#b-zin').onclick = () => zoomCenter(1.2); $('#b-zout').onclick = () => zoomCenter(1/1.2);
$('#b-fit').onclick = fitView;
$('#b-export').onclick = () => showExport('json');
$('#b-import').onclick = showImport;
$('#b-new').onclick = () => { commit(); doc = blankDoc(); sel = {nodes:new Set(), edge:null}; view = {x:0,y:0,k:1}; render(); renderPanel(); toast('新しい図を作成しました（元に戻すで復元できます）'); };
$('#panelbtn').onclick = () => { const open = panel.classList.toggle('closed') === false; panel.dataset.open = open ? '1' : ''; };
bindEdit($('#docname'), v => doc.name = v);

/* ---------- boot ---------- */
try { const s = localStorage.getItem(STORE); doc = s ? normalize(JSON.parse(s)) : sampleDoc(); } catch { doc = sampleDoc(); }
render(); renderPanel();
requestAnimationFrame(fitView);
window.addEventListener('resize', () => render());
})();
</script>
</html>
