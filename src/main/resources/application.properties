spring.application.name=hp-gomoku
server.port=${PORT:8080}
# 人間プレイヤー同士のレーティングを保存するファイル（サーバー再起動をまたいで保持される）。
ratings.file=${RATINGS_FILE:ratings.json}
# 学習AI（LEARN）の評価関数の重みを保存するファイル（サーバー再起動をまたいで保持される）。
ai.weights.file=${AI_WEIGHTS_FILE:ai_weights.json}
# ニューラルネットAI（NEURAL）が読み込むONNXモデルファイル。未設定/ファイルが無い場合、
# NEURALレベルは選択できない（他のAIレベルの動作には影響しない）。
neural.model.file=${NEURAL_MODEL_FILE:}
# 上記モデルファイルの更新日時をこの間隔（ミリ秒）で監視し、変更を検知したら自動で再読み込みする
# （学習ループ側で新しいモデルをエクスポートしても、サーバー再起動なしで対人戦に反映される）。
neural.model.reload-check-interval-ms=${NEURAL_MODEL_RELOAD_CHECK_INTERVAL_MS:30000}
