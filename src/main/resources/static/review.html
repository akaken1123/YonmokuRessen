<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>棋譜検討 - HP制四目並べ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">
  <h1>棋譜検討</h1>
  <div class="subtitle">対局ID：<span id="reviewGameId"></span>（盤面をクリックしての着手はできません）</div>

  <div id="errorBox"></div>

  <div class="review-controls">
    <button id="firstBtn" title="最初の手へ">|&lt;&lt;</button>
    <button id="prevBtn" title="前の手へ">&lt; 前へ</button>
    <span id="moveIndicator">- / -</span>
    <button id="nextBtn" title="次の手へ">次へ &gt;</button>
    <button id="lastBtn" title="最新の手へ">&gt;&gt;|</button>
    <button id="refreshBtn" title="サーバーから棋譜を取得し直す">🔄 更新</button>
  </div>

  <div class="hp-row">
    <div class="hp-card" id="hpCardB">
      <div class="stone-badge black"></div>
      <div class="hp-info">
        <div class="hp-label">黒 プレイヤー</div>
        <div class="hp-bar" id="hpBarB"></div>
      </div>
    </div>
    <div class="hp-card" id="hpCardW">
      <div class="stone-badge white"></div>
      <div class="hp-info">
        <div class="hp-label">白 プレイヤー</div>
        <div class="hp-bar" id="hpBarW"></div>
      </div>
    </div>
  </div>

  <div class="status" id="status">読み込み中...</div>

  <div class="board-outer">
    <div class="board" id="board"></div>
  </div>

  <div class="legend">
    <span><span class="swatch mark-dmg"></span>ダメージ増加マーク（+1）</span>
    <span><span class="swatch mark-echo"></span>除外あと（バックアタック +1）</span>
    <span><span class="swatch mark-echo was-dmg"></span>除外あと・マーク付き（+2）</span>
  </div>

  <div class="controls">
    <a id="backToGameLink" href="game.html"><button type="button">対局に戻る</button></a>
    <a href="index.html"><button type="button">ロビーへ戻る</button></a>
  </div>

  <div class="log-panel">
    <div class="log-title">手順（クリックでその局面を表示、←→キーでも移動できます）</div>
    <div id="moveList"></div>
  </div>
</div>

<script src="js/review.js"></script>
</body>
</html>
