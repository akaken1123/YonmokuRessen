<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HP制四目並べ - レーティング</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">
  <h1>HP制 四目並べ</h1>
  <div class="subtitle">レーティングランキング（人間プレイヤー同士の対局のみが対象）</div>

  <div id="errorBox"></div>

  <div class="lobby-card">
    <div class="controls" style="margin:0 0 12px 0;">
      <button id="refreshBtn">更新</button>
      <a href="index.html"><button type="button">ロビーへ戻る</button></a>
    </div>
    <table class="ratings-table">
      <thead>
        <tr><th>順位</th><th>ニックネーム</th><th>レーティング</th><th>勝</th><th>負</th><th>分</th></tr>
      </thead>
      <tbody id="ratingsBody"></tbody>
    </table>
    <p id="emptyNote" style="display:none;">まだレーティングが記録された対局がありません。黒白両方にニックネームを登録して対局すると、ここに記録されます。</p>
  </div>
</div>

<script src="js/ratings.js"></script>
</body>
</html>
